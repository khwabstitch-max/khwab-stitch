name: Deploy Vite Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /khwab-stitch/
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD || vars.VITE_ADMIN_PASSWORD || 'Dhaniya123' }}
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP || '+91 98765 43210' }}
          VITE_INSTAGRAM: ${{ vars.VITE_INSTAGRAM || '@khwabstitch' }}
          VITE_WEBSITE: ${{ vars.VITE_WEBSITE || 'khwabstitch.com' }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Notice: VITE_API_BASE_URL variable is not set. Building with default origin."
          fi
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
