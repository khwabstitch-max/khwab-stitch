services:
  - type: web
    name: khwab-stitch-orders
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        value: Dhaniya123
      - key: DB_PATH
        value: data/orders.sqlite
      - key: ALLOWED_ORIGINS
        value: https://khwabstitch-max.github.io,https://khwabstitch-max.github.io/khwab-stitch
